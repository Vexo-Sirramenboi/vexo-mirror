
name: Mirror V3lla Files

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download website files
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://s3.amazonaws.com/v3lla"
          mkdir -p assets

          # Download the entry point.
          curl -fsSL "$BASE/index.html" -o index.html

          # Download known runtime files.
          for path in \
            assets/core.js \
            assets/cfg.js \
            assets/work.js \
            assets/rw.js \
            assets/rw.wasm \
            assets/rw-sync.js \
            errorpage.html
          do
            mkdir -p "$(dirname "$path")"
            curl -fsSL "$BASE/$path" -o "$path"
          done

          # Crawl linked resources from the S3 host.
          wget \
            --recursive \
            --level=inf \
            --no-parent \
            --domains=s3.amazonaws.com \
            --accept-regex='s3\.amazonaws\.com/v3lla/.*' \
            --execute robots=off \
            --no-host-directories \
            --cut-dirs=1 \
            --directory-prefix=. \
            "$BASE/index.html" || true

          echo "Files downloaded:"
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            | sort

      - name: Commit downloaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Mirror website files"
            git push
          fi
